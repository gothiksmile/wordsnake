  If asked to add a feature, patch this exact file — do not regenerate

  Round 3 (LaTeX on the game board): latexImage() now overwrites the
  MathJax SVG's width/height attributes with the plain numbers from its
  own viewBox before turning it into a data-URI Image for canvas drawing.
  MathJax's tex2svgPromise() returns width/height in "ex" units, which
  have no meaningful size once the SVG is detached from the page (loaded
  as a standalone Image, as drawCard()/latexImage() do for board cards) —
  browsers can't resolve "ex" without a font context, so the image comes
  out with a degenerate (near-zero) height and renders as a flat dash
  instead of the formula. Inline-DOM MathJax (the on-screen hint/prompt
  text via setRichText/typesetLatex) was never affected — only the
  canvas-card path. Keep the viewBox-based width/height override; don't
  remove it as "redundant" just because the SVG already has a viewBox.

  Round 4 (Listen audio, explicit spec from the user): two separate audio
  concepts, don't merge them.
  1) Hint/prompt audio — one per line of hintText, stored in
     task.rowMedia[i].audio (same mechanism as Build/Spell), aligned via
     alignRowMedia(task.hintText,...). This is what auto-plays when a
     round starts (expandTaskRows sets current.audio from
     base.rowMedia[index].audio), through the existing countdown -> 80ms
     delay -> playTaskAudio(true) path in enterRunning() — that timing
     already existed, only the audio source moved.
  2) Per-answer audio — task.answerAssets stays {mode, image} only (no
     audio field); the actual audio lives in task.listenAssets, uploaded
     directly by the per-option audio button. renderAnswerAssets() shows
     the "Audio required" warning ONLY when that option's text is used as
     a correct answer in at least one row (isCorrect check against
     taskLines(t.correct.text)); wrong-only options can have audio but
     are never flagged as missing it.
  Do not collapse these two back into one system, and do not make wrong
  answers show "Audio required" again.

  Round 5 (LaTeX on canvas — round 3 alone wasn't enough): MathJax's
  svg.fontCache setting must be "local", not "global". With "global",
  each formula's <svg> references its glyphs via <use> pointing at a
  SHARED <defs> block that only exists once, elsewhere in the document —
  it never travels with the individual <svg> node. latexImage() extracts
  exactly that one <svg> and serializes it alone as a standalone
  data:image/svg+xml Image, so with "global" the <use> refs point at
  nothing and the glyph doesn't render (verified directly against real
  MathJax output: "global" produces zero local <path> glyphs inside the
  svg's own <defs>; "local" does). This must stay "local" in BOTH the
  editor's own live MathJax config AND the config string buildGameHtml()
  writes into the exported game — fixing only one of the two still
  leaves the other broken. Also added: requestLatexTypeset(...) on
  "[data-answer-assets-list] .answer-name" spans, called from
  renderEditor() and from refreshOptionAssets() after it rewrites that
  list — renders the Listen answer-name previews as formulas inside the
  editor itself, not just on the game board.

  Round 6 (uniform card size for Listen): spawnSource()'s w/h used to be
  computed per-item from raw source.text.length — including LaTeX markup
  characters (backslashes, braces, ^) — so two visually-similar formulas
  with different SOURCE lengths (e.g. "\( x-4=0 \)" vs "\( x^2-4=0 \)")
  got different card sizes, which looked random/inconsistent on the
  board. For "listen" specifically (a fixed set of discrete answer
  choices, not a fitted line of text), spawnItems() now computes ONE
  size via computeUniformCardSize() from the longest text across the
  whole correct+wrong pool for that round, and passes it as spawnSource's
  new optional forcedSize argument so every card that round is the same
  w×h. build/spell/collect/complete are untouched — they still use the
  old per-item length-based sizing; don't silently extend forcedSize to
  them without being asked, their sizing serves a different purpose
  (build/spell cards are read as parts of one continuous line).

  silent): round 10 made Listen's auto-played current.audio come ONLY

  Round 17 (per user's explicit request — "portal should teleport in any

  on that edge if it's fully blocked, trying the other candidate edges
  in turn before giving up. This also happens to make the original "many
  followers -> unexplained life loss" bug (round 13) even rarer, since
  there are now 3 edges to try instead of 1, but each edge still needs
  its own inward search for the fully-degenerate case. This REPLACES an
  intermediate "shift the whole snake body through the portal" design
  that existed only in one intermediate delivery — verified that design
  breaks down for cross-axis edges: a horizontal exit shifts x by
  exactly `cols`, which is always 0 mod cols, so the body's x-coordinates

  the "entire opposite edge occupied" case (confirmed empirically:
  2000/2000 failures), on top of not generalizing cleanly to landing on

function uid(prefix="id") { return prefix + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function clamp(n,min,max){ return Math.max(min,Math.min(max,Number(n)||0)); }
function deepClone(v){ return JSON.parse(JSON.stringify(v)); }
function makeItem(text,kind){ return {id:uid("item"),text,kind,mode:"text",image:"",audio:""}; }

const TASK_TYPES=["collect","build","listen","complete","spell"];
function defaultTask(type="build"){
  const common={id:uid("task"),title:"Task",audio:"",hintText:"",hintImage:"",distractors:[],wrong:[],parts:[]};
  if(type==="build")return {...common,title:"Sentence 1",sequence:"We | went | shopping | yesterday.",distractors:[makeItem("go","wrong"),makeItem("tomorrow","wrong")],allowReplay:true,maxPlays:0,showBuilt:true,keepProgress:true,shuffle:true};
  if(type==="listen")return {...common,title:"Audio 1",listenMode:"choose",audioText:"pumpkin",correct:makeItem("pumpkin","correct"),wrong:[makeItem("apple","wrong"),makeItem("carrot","wrong")],sequence:"pump | kin",autoplay:true,allowReplay:true,maxPlays:0,volume:.8,audioDelay:0,showTranscript:true,shuffle:true};
  if(type==="complete")return {...common,title:"Sentence 1",sentence:"Tom ___ a pumpkin yesterday.",correct:makeItem("bought","correct"),wrong:[makeItem("buys","wrong"),makeItem("buy","wrong"),makeItem("buying","wrong")],shuffle:true,showAnswer:true,showDuration:1.2};
  if(type==="spell")return {...common,title:"Word 1",spellMode:"letters",word:"pumpkin",hintText:"A large orange vegetable",distractors:[makeItem("a","wrong"),makeItem("o","wrong")],showSlots:true,showAnswer:true};
  return common;
}

function partsFromText(text,type,existing=[]){

function buildGameHtml(projectInput=state){const project=normalizeProject(projectInput),data=JSON.stringify(project).replace(/</g,"\\u003c"),runtime=mountWordSnakeV2.toString(),mathJax=project.settings.latexEnabled?`<script>window.MathJax={tex:{inlineMath:[["\\\\(","\\\\)"],["$","$"]],displayMath:[["\\\\[","\\\\]"],["$$","$$"]]},svg:{fontCache:"local"},startup:{typeset:false}};<\/script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"><\/script>`:"";return `<!doctype html><html lang="${esc(project.settings.gameLanguage)}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Educational Word Snake game"><title>${esc(project.title)}</title>${mathJax}<style>${exportedGameCSS()}</style></head><body><main id="word-snake-game"></main><script>"use strict";const PROJECT=${data};(${runtime})(document.getElementById("word-snake-game"),PROJECT);`+"</scr"+"ipt></body></html>";}
function blobToDataURL(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(blob);});}
function dataURLToBlob(value){const match=String(value||"").match(/^data:([^,]*),([\s\S]*)$/i);if(!match)throw new Error("invalid-data-url");const metadata=match[1],type=metadata.split(";")[0]||"application/octet-stream",base64=/(?:^|;)base64(?:;|$)/i.test(metadata);if(!base64){let decoded;try{decoded=decodeURIComponent(match[2]);}catch(e){decoded=match[2];}return new Blob([new TextEncoder().encode(decoded)],{type});}const binary=atob(match[2].replace(/\s+/g,"")),bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);return new Blob([bytes],{type});}
function mediaOptionsFor(owner,key){const audio=key==="audio"||key==="src"&&(("volume" in (owner||{})&&"enabled" in (owner||{}))||String(owner?.src||"").match(/^(?:data:audio\/|https?:.*\.(?:mp3|wav|ogg|m4a|aac|webm)(?:[?#]|$))/i));if(audio)return {kind:"audio"};if(/(?:board|background)/i.test(key))return {kind:"image",maxWidth:1920,maxHeight:1080};if(/(?:icon)/i.test(key))return {kind:"image",maxWidth:768,maxHeight:768};if(/(?:button)/i.test(key))return {kind:"image",maxWidth:1600,maxHeight:900};return {kind:"image",maxWidth:1400,maxHeight:1400};}
function collectMediaReferences(project){const refs=[],seenOwners=new WeakMap(),isMediaKey=key=>key==="src"||key==="audio"||/(?:image)$/i.test(key);const visit=node=>{if(!node||typeof node!=="object")return;if(Array.isArray(node)){node.forEach(visit);return;}if(node===project.assets)return;for(const [key,value] of Object.entries(node)){if(key==="assets")continue;if(value&&typeof value==="object"){visit(value);continue;}if(typeof value!=="string"||!value||!isMediaKey(key)||!(/^(?:data:|https?:\/\/|asset:)/i.test(value)))continue;let keys=seenOwners.get(node);if(!keys){keys=new Set();seenOwners.set(node,keys);}if(keys.has(key))continue;keys.add(key);refs.push({owner:node,key,value,options:mediaOptionsFor(node,key)});}};visit(project);return refs;}
function formatAssetBytes(value){const bytes=Number(value)||0;if(bytes<1024)return `${bytes} B`;if(bytes<1024*1024)return `${(bytes/1024).toFixed(1)} KB`;return `${(bytes/1024/1024).toFixed(2)} MB`;}
async function prepareProjectForExport(source){const project=normalizeProject(source),existingAssets={...(project.assets||{})},refs=collectMediaReferences(project),remoteCache=new Map(),sourceHashes=new Set(),registryHashes=new Map(),registry={},unresolvedUrls=new Set(),stats={originalMediaSize:0,optimizedMediaSize:0,uniqueAssets:0,duplicatesRemoved:0,imagesOptimized:0,audioOptimized:0,remoteAssetsOptimized:0,unresolvedUrls:0};delete project.assets;
  const fetchRemote=url=>{if(remoteCache.has(url))return remoteCache.get(url);const promise=(async()=>{const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),20000);try{const response=await fetch(url,{mode:"cors",signal:controller.signal});if(!response.ok)throw new Error(`HTTP ${response.status}`);return await response.blob();}finally{clearTimeout(timeout);}})();remoteCache.set(url,promise);return promise;};
  for(let index=0;index<refs.length;index++){const ref=refs[index],remote=/^https?:\/\//i.test(ref.value);let sourceBlob;try{if(ref.value.startsWith("asset:")){const stored=existingAssets[ref.value.slice(6)];if(!stored)continue;sourceBlob=dataURLToBlob(stored);}else sourceBlob=remote?await fetchRemote(ref.value):dataURLToBlob(ref.value);const optimized=await optimizeAsset(sourceBlob,ref.options);stats.originalMediaSize+=optimized.originalSize;if(!sourceHashes.has(optimized.sourceHash)){sourceHashes.add(optimized.sourceHash);if(optimized.changed&&optimized.kind==="image")stats.imagesOptimized++;if(optimized.changed&&optimized.kind==="audio")stats.audioOptimized++;}if(remote)stats.remoteAssetsOptimized++;let assetId=registryHashes.get(optimized.optimizedHash);if(!assetId){assetId=`asset_${registryHashes.size+1}`;registryHashes.set(optimized.optimizedHash,assetId);registry[assetId]=await blobToDataURL(optimized.blob);stats.optimizedMediaSize+=optimized.optimizedSize;}else stats.duplicatesRemoved++;ref.owner[ref.key]=`asset:${assetId}`;}catch(error){if(remote){unresolvedUrls.add(ref.value);continue;}console.warn("Word Snake asset optimization fallback",ref.key,error);}}
  project.assets=registry;stats.uniqueAssets=registryHashes.size;stats.unresolvedUrls=unresolvedUrls.size;stats.saved=Math.max(0,stats.originalMediaSize-stats.optimizedMediaSize);console.info(["Word Snake media optimization report",`Original media size: ${formatAssetBytes(stats.originalMediaSize)}`,`Optimized media size: ${formatAssetBytes(stats.optimizedMediaSize)}`,`Saved: ${formatAssetBytes(stats.saved)}`,`Unique assets: ${stats.uniqueAssets}`,`Duplicates removed: ${stats.duplicatesRemoved}`,`Images optimized: ${stats.imagesOptimized}`,`Audio optimized: ${stats.audioOptimized}`,`Remote assets optimized: ${stats.remoteAssetsOptimized}`,`Unresolved URLs: ${stats.unresolvedUrls}`].join("\n"));return {project,stats};}
let exportInProgress=false;async function exportGame(){if(exportInProgress)return;exportInProgress=true;notify(message("optimizingMedia"));try{const {project,stats}=await prepareProjectForExport(state);notify(message("preparingGame"));download(`${safeName(project.title)}-game.html`,buildGameHtml(project),"text/html");notify(stats.unresolvedUrls?`${message("gameReady")} · ${stats.unresolvedUrls} URL`:message("gameReady"));}catch(e){console.error("Word Snake export failed",e);notify(message("uploadFailed"));}finally{exportInProgress=false;}}
function mediaOwner(card){if(!card)return null;const kind=card.dataset.collectMediaKind;if(kind){const index=Number(card.dataset.collectMediaIndex);return selectedLevel()[kind]?.[index]||null;}const index=Number(card.dataset.rowMediaIndex),task=selectedTask();if(!task||!Number.isInteger(index)||index<0)return null;task.rowMedia ||= [];task.rowMedia[index] ||= {image:"",audio:""};return task.rowMedia[index];}

document.addEventListener("click",async e=>{
  const csvHelpType=e.target.closest("[data-csv-help-open]")?.dataset.csvHelpOpen;if(csvHelpType){openCsvHelp(csvHelpType);return;}
  const section=e.target.closest("[data-section]")?.dataset.section;if(section){if(section!=="levels")livePreviewLevelId="";if(section!=="design")previewWindowKind="";state.activeSection=section;renderEditor();return;}
  const levelId=e.target.closest("[data-select-level]")?.dataset.selectLevel;if(levelId){state.selectedLevelId=levelId;if(livePreviewLevelId)livePreviewLevelId=levelId;renderEditor();schedulePreview(levelId);return;}
  const taskId=e.target.closest("[data-select-task]")?.dataset.selectTask;if(taskId){selectedLevel().selectedTaskId=taskId;renderEditor();renderPreview(selectedLevel().id,taskId);return;}
  const taskAction=e.target.closest("[data-task-action]")?.dataset.taskAction;if(taskAction==="clear"){clearCurrentTaskContent();return;}
  const levelAction=e.target.closest("[data-level-action]")?.dataset.levelAction;if(levelAction){renderLevelAction(levelAction);return;}
  const previewWindow=e.target.closest("[data-preview-window]")?.dataset.previewWindow;if(previewWindow){previewWindowKind=previewWindow;renderPreview();return;}
  const action=e.target.closest("[data-action]")?.dataset.action;if(action==="import-csv"){if(CSV_IMPORT_TYPES.has(selectedLevel().type))document.getElementById("csv-file").click();return;}if(action==="export-game")exportGame();if(action==="copy-iframe")copyIframe();if(action==="reset-design"){if(confirm(tr("resetConfirm"))){const defaults=normalizeProject(createDefaultState());state.design=deepClone(defaults.design);state.settings.showEndScreen=defaults.settings.showEndScreen;state.settings.useStartScreen=defaults.settings.useStartScreen;state.settings.showOnScreenControls=defaults.settings.showOnScreenControls;renderEditor();renderPreview();notify(tr("resetDesign"));}return;}
  const mediaCard=e.target.closest("[data-row-media-index],[data-collect-media-kind]"),mediaUpload=e.target.closest("[data-media-upload]")?.dataset.mediaUpload;if(mediaUpload&&mediaCard){const owner=mediaOwner(mediaCard);if(owner)chooseFile(mediaUpload==="audio"?"audio/*":"image/*",async file=>{try{owner[mediaUpload]=await readFileData(file,mediaUpload==="image"?{maxWidth:1600,maxHeight:1600}:undefined);if(mediaCard.dataset.collectMediaKind&&mediaUpload==="image"&&owner.mode==="text")owner.mode="text-image";refreshMediaRows();renderPreview(selectedLevel().id,selectedTask()?.id);notify(mediaUpload==="audio"?message("taskAudioEmbedded"):message("imageOptimized"));}catch(err){notify(message("uploadFailed"));}});return;}
  if(e.target.closest("[data-media-preview]")&&mediaCard){const src=mediaOwner(mediaCard)?.audio;if(src){const audio=new Audio(src);audio.play().catch(()=>notify(message("audioPlayFailed")));}else notify(message("addAudioFirst"));return;}
  if(e.target.closest("[data-clear-row-media]")&&mediaCard){const owner=mediaOwner(mediaCard);if(owner){owner.image="";owner.audio="";refreshMediaRows();renderPreview(selectedLevel().id,selectedTask()?.id);}return;}
  const uploadListenImage=e.target.closest("[data-upload-listen-image]")?.dataset.uploadListenImage;if(uploadListenImage!==undefined)chooseFile("image/*",async f=>{try{const t=selectedTask(),index=Number(uploadListenImage);if(t){syncListenAssets(t);if(t.listenAssets[index])t.listenAssets[index].image=await readFileData(f,{maxWidth:1400,maxHeight:1400});renderEditor();renderPreview(selectedLevel().id,t.id);notify(message("imageOptimized"));}}catch(err){notify(message("uploadFailed"));}});
  const uploadListenAudio=e.target.closest("[data-upload-listen-audio]")?.dataset.uploadListenAudio;if(uploadListenAudio!==undefined)chooseFile("audio/*",async f=>{try{const t=selectedTask(),index=Number(uploadListenAudio);if(t){syncListenAssets(t);if(t.listenAssets[index])t.listenAssets[index].audio=await readFileData(f);renderEditor();renderPreview(selectedLevel().id,t.id);notify(message("taskAudioEmbedded"));}}catch(err){notify(message("uploadFailed"));}});
  const clearListen=e.target.closest("[data-clear-listen]")?.dataset.clearListen;if(clearListen!==undefined){const t=selectedTask(),index=Number(clearListen);if(t){syncListenAssets(t);if(t.listenAssets[index]){t.listenAssets[index].image="";t.listenAssets[index].audio="";t.listenAssets[index].mode="text";}renderEditor();renderPreview(selectedLevel().id,t.id);}return;}
  const listenPreview=e.target.closest("[data-listen-audio-preview]")?.dataset.listenAudioPreview;if(listenPreview!==undefined){const t=selectedTask(),index=Number(listenPreview);syncListenAssets(t);const src=t?.listenAssets?.[index]?.audio;if(src)new Audio(src).play().catch(()=>notify(message("audioPlayFailed")));else notify(message("addAudioFirst"));return;}
  const designUpload=e.target.closest("[data-design-upload]")?.dataset.designUpload;if(designUpload)chooseFile("image/*",async f=>{try{const iconKeys=new Set(["lifeIconImage","timerIconImage","scoreIconImage"]),buttonKeys=new Set(["startButtonImage","replayButtonImage"]),limits=designUpload==="boardBackgroundImage"?{maxWidth:1920,maxHeight:1080}:iconKeys.has(designUpload)?{maxWidth:768,maxHeight:768}:buttonKeys.has(designUpload)?{maxWidth:1600,maxHeight:900}:{maxWidth:1400,maxHeight:1400};state.design[designUpload]=await readFileData(f,limits);if(designUpload==="headImage")state.design.heroType="followers";renderEditor();renderPreview();notify(designUpload==="headImage"?message("heroOptimized"):message("imageOptimized"));}catch(err){notify(message("uploadFailed"));}});
  const designClear=e.target.closest("[data-design-clear]")?.dataset.designClear;if(designClear){state.design[designClear]="";if(designClear==="headImage")state.design.heroType="segmented";renderEditor();renderPreview();}

document.addEventListener("input",e=>{
  const path=e.target.dataset.path;if(path){const value=coerceInput(e.target);if(path.startsWith("level.")){const l=selectedLevel(),key=path.split(".")[1];if(key==="type"&&l.type!==value){l.taskVariants ||= {};l.taskVariants[l.type]=deepClone(l.tasks);l.type=value;l.tasks=deepClone(l.taskVariants[value]||(value==="collect"?[]:[defaultTask(value)]));l.selectedTaskId=l.tasks[0]?.id||"";}else l[key]=value;}else{setPath(path,value);if(e.target.type==="range"){const output=document.querySelector(`[data-range-value="${path}"]`);if(output)output.textContent=`${value}%`;}if(path==="design.headImage"&&value)state.design.heroType="followers";if(path==="design.heroType"&&value==="segmented"&&state.design.headImage){state.design.heroType="followers";notify(message("clearHeroFirst"));}}schedulePreview();return;}
  const kind=e.target.dataset.itemsKind;if(kind){syncLines(kind,e.target.value);refreshMediaRows();schedulePreview();return;}
  const mediaField=e.target.dataset.mediaField;if(mediaField){const card=e.target.closest("[data-row-media-index],[data-collect-media-kind]"),owner=mediaOwner(card);if(owner){owner[mediaField]=e.target.value.trim();if(card.dataset.collectMediaKind&&mediaField==="image")owner.mode=owner.image?"text-image":"text";scheduleSelectedTaskPreview();}return;}
  const taskFieldKey=e.target.dataset.taskField;if(taskFieldKey){const t=selectedTask();if(t){setNested(t,taskFieldKey,coerceInput(e.target));syncSelectedTaskParts();if(["sequence","sentence","word","correct.text","hintText","listenMode"].includes(taskFieldKey))refreshMediaRows();if(["word","wrongRows","correct.text","listenMode"].includes(taskFieldKey))refreshOptionAssets();scheduleSelectedTaskPreview();}return;}
  const listenAssetField=e.target.dataset.listenAssetField;if(listenAssetField){const t=selectedTask(),index=Number(e.target.closest("[data-listen-asset-index]")?.dataset.listenAssetIndex);if(t&&Number.isInteger(index)){syncListenAssets(t);if(t.listenAssets[index])t.listenAssets[index][listenAssetField]=coerceInput(e.target);if(listenAssetField==="mode")renderEditor();scheduleSelectedTaskPreview();}return;}

});
document.addEventListener("change",e=>{
  if(e.target.matches("[data-latex-enabled]")){state.settings.latexEnabled=e.target.checked;if(!state.settings.latexEnabled)closeLatexModal();clearTimeout(previewTimer);renderEditor();renderPreview();return;}
  if(e.target.matches("[data-ui-language]")){uiLanguage=UI_TEXT[e.target.value]?e.target.value:"ru";state.settings.interfaceLanguage=uiLanguage;state.settings.gameLanguage=uiLanguage;try{localStorage.setItem("wordSnakeEditorLanguage",uiLanguage)}catch(err){}renderEditor();renderPreview();return;}
  const enabledId=e.target.dataset.levelEnabled;
  if(enabledId!==undefined){
    const level=state.levels.find(l=>l.id===enabledId);if(!level)return;
    if(!e.target.checked&&state.levels.filter(l=>l.enabled!==false).length===1){e.target.checked=true;return;}
    level.enabled=e.target.checked;
    if(!level.enabled&&livePreviewLevelId===level.id)livePreviewLevelId="";
    clearTimeout(previewTimer);state=normalizeProject(state);renderEditor();renderPreview();return;
  }
  const previewPref=e.target.dataset.previewPref;if(previewPref){previewPrefs[previewPref]=e.target.checked;if(e.target.checked&&((previewPref==="hideStart"&&previewWindowKind==="start")||(previewPref==="hideFeedback"&&["victory","defeat"].includes(previewWindowKind))))previewWindowKind="";clearTimeout(previewTimer);renderPreview();return;}
  if(e.target.dataset.itemsKind||e.target.dataset.taskField||e.target.dataset.listenAssetField)renderEditor();
  const path=e.target.dataset.path;
  if(path&&path.startsWith("level.")){clearTimeout(previewTimer);const l=selectedLevel(),key=path.split(".")[1];if(key!=="type")l[key]=coerceInput(e.target);state=normalizeProject(state);renderEditor();renderPreview();}
  else if(path){setPath(path,coerceInput(e.target));clearTimeout(previewTimer);renderPreview();}
  if(path==="design.heroType"||path==="design.headImage"||path==="settings.levelOrder"||path==="settings.singleLevelId"){renderEditor();renderPreview();}
});
